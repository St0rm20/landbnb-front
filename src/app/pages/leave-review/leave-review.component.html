<div class="body-overlay"></div>
<nav class="navbar navbar-expand-lg bg-light border-bottom shadow-sm">
    <div class="container-fluid d-flex justify-content-between align-items-center py-2 px-5">
        <a class="navbar-brand d-flex align-items-center" routerLink="/">
            <img src="assets/imagenes/Logo.png" alt="Logo Landbnb" class="logo-img">
            <span class="fs-6 fw-bold" style="color: #b97479;">Landbnb</span>
        </a>
        <div class="d-flex align-items-center ms-auto">
            <a routerLink="/perfil">
                <img src="assets/imagenes/perfil.png" alt="Perfil" class="rounded-circle" style="width: 40px; height: 40px;">
            </a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card p-4">
                <h1 class="mb-3">Deja tu opinión</h1>
                <p class="text-white-50 mb-4">Tu feedback ayuda a otros viajeros a elegir y a los anfitriones a mejorar.</p>

                <div class="card mb-4" style="background-color: rgba(0,0,0,0.2);">
                    <div class="card-body d-flex align-items-center">
                        <img src="assets/imagenes/hostal3.jpg" alt="Alojamiento" class="rounded" style="width: 100px; height: 75px; object-fit: cover;">
                        <div class="ms-3">
                            <h5 class="mb-1">Cabaña en la Montaña</h5>
                            <p class="text-white-50 mb-0">Tu estadía: 01 mayo - 05 mayo, 2025</p>
                        </div>
                    </div>
                </div>

                <form (ngSubmit)="onSubmit()">
                    <div class="mb-4 text-center">
                        <label class="form-label d-block fs-5 mb-3">Tu Calificación General</label>
                        <div class="star-rating">
                            <i *ngFor="let star of [1,2,3,4,5]"
                               class="fa-star mx-1"
                               [ngClass]="rating >= star ? 'fas' : 'far'"
                               (click)="setRating(star)">
                            </i>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="comment" class="form-label fs-5">Tu Comentario</label>
                        <textarea class="form-control"
                                  id="comment"
                                  rows="5"
                                  placeholder="Describe tu experiencia..."
                                  maxlength="500"
                                  required
                                  [(ngModel)]="comment"
                                  name="comment"></textarea>
                        <div class="form-text text-white-50">Máximo 500 caracteres.</div>
                    </div>

                    <button type="submit" class="btn btn-primary px-4 mt-3">Enviar Comentario</button>
                </form>
            </div>
        </div>
    </div>
</div>
