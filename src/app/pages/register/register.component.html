<div class="register-page">
    <div class="body-overlay"></div>

    <div class="container">
        <div class="card register-card">
            <div class="card-body">
                <div class="text-center mb-4">
                    <a routerLink="/">
                        <img src="../../../assets/imagenes/logo.png" alt="Logo Landbnb" class="logo-img">
                    </a>
                    <h3 class="mt-3">Crea tu cuenta para empezar a explorar</h3>
                </div>

                <form [formGroup]="registerForm" (ngSubmit)="createUser()" novalidate>

                    <div class="form-grid">
                        <div class="form-column">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" formControlName="name"
                                   [class.is-invalid]="submitted && f['name'].errors">
                            <div *ngIf="submitted && f['name'].errors?.['required']" class="invalid-feedback">
                                El nombre es requerido
                            </div>
                        </div>

                        <div class="form-column">
                            <label class="form-label">Apellido</label>
                            <input type="text" class="form-control" formControlName="lastName"
                                   [class.is-invalid]="submitted && f['lastName'].errors">
                            <div *ngIf="submitted && f['lastName'].errors?.['required']" class="invalid-feedback">
                                El apellido es requerido
                            </div>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-column">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" formControlName="email"
                                   placeholder="nombre@ejemplo.com"
                                   [class.is-invalid]="submitted && f['email'].errors">
                            <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
                                <span *ngIf="f['email'].errors?.['required']">El email es requerido</span>
                                <span *ngIf="f['email'].errors?.['email']">Formato de email inválido</span>
                            </div>
                        </div>

                        <div class="form-column">
                            <label class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" formControlName="phoneNumber"
                                   [class.is-invalid]="submitted && f['phoneNumber'].errors">
                            <div *ngIf="submitted && f['phoneNumber'].errors?.['required']" class="invalid-feedback">
                                El teléfono es requerido
                            </div>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-column">
                            <label class="form-label">Fecha de nacimiento</label>
                            <input type="date" class="form-control date-input" formControlName="birthDate"
                                   [class.is-invalid]="submitted && f['birthDate'].errors">
                            <div *ngIf="submitted && f['birthDate'].errors?.['required']" class="invalid-feedback">
                                La fecha es requerida
                            </div>
                        </div>

                        <div class="form-column">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" formControlName="password"
                                   [class.is-invalid]="submitted && f['password'].errors">
                            <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
                                <span *ngIf="f['password'].errors?.['required']">Contraseña requerida</span>
                                <span *ngIf="f['password'].errors?.['minlength']">Mínimo 8 caracteres</span>
                            </div>
                        </div>
                    </div>

                    <div class="form-grid mt-4">
                        <div class="form-full">
                            <button type="submit" class="btn-primary">
                                Crear Cuenta
                            </button>
                            <p class="text-center mt-3 mb-0">
                                ¿Ya tienes una cuenta?
                                <a routerLink="/login">Inicia sesión</a>
                            </p>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
